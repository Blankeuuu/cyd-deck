[platformio]
default_envs = cyd28_ili9341, cyd28_st7789

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
upload_port = COM4
upload_speed = 115200
lib_deps = lovyan03/LovyanGFX@1.2.7
build_flags = -std=gnu++17 -DCORE_DEBUG_LEVEL=3
build_src_filter = +<*> -<app_main.cpp> -<ui/>
extra_scripts = post:../scripts/canonical_esptool_path.py

[env:cyd28_ili9341]
build_flags = -std=gnu++17 -DCORE_DEBUG_LEVEL=3 -DDISPLAY_DRIVER_ILI9341

[env:cyd28_st7789]
build_flags = -std=gnu++17 -DCORE_DEBUG_LEVEL=3 -DDISPLAY_DRIVER_ST7789

[env:cyd28_ili9341_app]
lib_deps =
  lovyan03/LovyanGFX@1.2.7
  lvgl/lvgl@9.3.0
  links2004/WebSockets@2.6.1
  bblanchon/ArduinoJson@7.4.2
board_build.partitions = partitions/streamdeck_ota.csv
build_flags = -std=gnu++17 -DCORE_DEBUG_LEVEL=3 -DDISPLAY_DRIVER_ILI9341 -DLV_CONF_INCLUDE_SIMPLE -Iinclude
build_src_filter = +<app_main.cpp> +<ui/> +<network/> +<display/> +<touch/> +<storage/>

[env:cyd28_st7789_app]
lib_deps =
  lovyan03/LovyanGFX@1.2.7
  lvgl/lvgl@9.3.0
  links2004/WebSockets@2.6.1
  bblanchon/ArduinoJson@7.4.2
board_build.partitions = partitions/streamdeck_ota.csv
build_flags = -std=gnu++17 -DCORE_DEBUG_LEVEL=3 -DDISPLAY_DRIVER_ST7789 -DLV_CONF_INCLUDE_SIMPLE -Iinclude
build_src_filter = +<app_main.cpp> +<ui/> +<network/> +<display/> +<touch/> +<storage/>

[env:cyd28_ili9341_wokwi_app]
lib_deps =
  lovyan03/LovyanGFX@1.2.7
  lvgl/lvgl@9.3.0
  links2004/WebSockets@2.6.1
  bblanchon/ArduinoJson@7.4.2
board_build.partitions = partitions/streamdeck_ota.csv
build_flags = -std=gnu++17 -DCORE_DEBUG_LEVEL=3 -DDISPLAY_DRIVER_ILI9341 -DWOKWI_SIMULATOR -DLV_CONF_INCLUDE_SIMPLE -Iinclude
build_src_filter = +<app_main.cpp> +<ui/> +<network/> +<display/> +<touch/> +<storage/>
